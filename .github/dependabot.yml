version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node major the app runs on (.nvmrc, Dockerfile, engines): raise them together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint refuses TypeScript 7 and Stryker cannot run on it. Remove once both support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # Same rule as @types/node above: the image's Node major moves with .nvmrc, engines and the types.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
